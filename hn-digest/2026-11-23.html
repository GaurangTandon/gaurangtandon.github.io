    <h1>HN Mindful Digest — November 23, 2026</h1>
    <p class="date">Monday, November 23, 2026</p>
  </header>
  <iframe class="digest" sandbox="allow-same-origin allow-popups allow-top-navigation-by-user-activation" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;base target=&quot;_blank&quot;&gt;&lt;style&gt;:root{color-scheme:light dark}body{margin:0;font:17px/1.7 -apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;background:transparent}p{margin:0 0 .6rem}ul{margin:0 0 1.5rem;padding-left:1.1rem;list-style:none}li{position:relative;margin:.25rem 0;padding-left:1rem;font-size:.92rem;color:#555}li::before{content:&#x27;\2014&#x27;;position:absolute;left:0;color:#aaa}a{color:#1a5fb4}@media(prefers-color-scheme:dark){body{color:#e6e6e6}li{color:#a8a8a8}li::before{color:#555}a{color:#6ea8fe}}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;p&gt;&lt;em&gt;Formal mathematics dominates the day, with large AI-assisted Lean proofs drawing scrutiny, alongside a new browser alpha, an unusual macOS-on-Linux project, and a maintainer&amp;#x27;s view of vulnerability-report overload.&lt;/em&gt;&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;Nvidia&amp;#x27;s board reinstates Jensen Huang as CEO.&lt;/strong&gt; In a &lt;a href=&quot;https://nvidianews.nvidia.com/news/nvidia-board-reinstates-jensen-huang-as-president-ceo-and-board-director&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;press release&lt;/a&gt;, Nvidia said its board voted unanimously to reinstate Huang as President, CEO and director. The board said it had received input from senior levels of the US government and is confident his return poses no national security risk. An independent investigation into reporting that he was the target of a foreign intelligence effort will continue, Colette Kress returns to her CFO role after serving as interim CEO, and the company is searching for a new Chief Compliance Officer (&lt;a href=&quot;https://news.ycombinator.com/item?id=50611588&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;A visual map of the 17-million-line Lean proof of the Riemann Hypothesis.&lt;/strong&gt; A new &lt;a href=&quot;https://pengowray.github.io/riemann-zeta-proof-visualizer/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;treemap visualizer&lt;/a&gt; breaks down the Lean 4 formalization Levent Alpöge released on 20 November, written with Claude, which states and proves the Riemann Hypothesis and its generalization to Dirichlet L-functions. The page counts 175,187 modules and 17,374,215 lines, with a longest import chain of 203, and notes that the statements do not cover Dedekind zeta functions or automorphic L-functions (&lt;a href=&quot;https://news.ycombinator.com/item?id=50606499&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters note that the map shows much of the bulk comes from formalizing long-established mathematics, with algebra alone taking a sizable share of the modules.&lt;/li&gt;&lt;li&gt;Some argue that a polished, human-readable account of the proof aimed at professional mathematicians is still missing.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;How 17 million lines of Lean compares to other formal proofs.&lt;/strong&gt; A &lt;a href=&quot;https://micjm.com/blog/yes-17m-lines-of-lean-is-a-lot/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;blog post&lt;/a&gt; compares the proof&amp;#x27;s length with the 259 famous theorems in Mathlib that have Lean proofs, all of them far smaller, and with packages indexed on Reservoir. The only comparable projects are an AI-built, unfinished classification-of-finite-simple-groups effort (88M lines), a database bridge that is mostly script-generated (36M), and Anthropic&amp;#x27;s AI-produced Fermat&amp;#x27;s Last Theorem proof (27M), which is roughly 450 times longer than the human-led FLT project (&lt;a href=&quot;https://news.ycombinator.com/item?id=50607668&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;One commenter points to a public effort that has already shrunk the proof to about 13 million lines.&lt;/li&gt;&lt;li&gt;Others note that because Lean reduces everything to kernel-checked primitives, length does not affect validity, though it does affect human understanding.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;An open, crowd-sourced AI agent effort on P vs NP.&lt;/strong&gt; The &lt;a href=&quot;https://pequalnp.com/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;pequalnp project&lt;/a&gt; coordinates a fleet of AI agents working on the problem in public. Anyone can connect an agent such as Claude Code, Cursor, Codex or Gemini CLI to take on an assigned open step, and every proof goes through the same Lean checker. The site tracks lemmas checked, claims refuted, and approaches ruled dead (&lt;a href=&quot;https://news.ycombinator.com/item?id=50604314&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;One commenter argues that publicly available models may not be capable enough here, since recent major results reportedly came from models that have not been externally released.&lt;/li&gt;&lt;li&gt;Commenters note that even a P=NP result would not automatically break cryptography if the polynomial bounds involve impractically large constants or exponents.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;XNU Linux runs the macOS kernel as a Linux kernel module.&lt;/strong&gt; The &lt;a href=&quot;https://github.com/AFK-surf/xnulinux&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;xnulinux project&lt;/a&gt; builds XNU from Apple&amp;#x27;s published sources and loads it as a module inside an unmodified arm64 Linux kernel, so macOS and Linux processes run side by side on the same CPUs without a hypervisor. Using a stock Ubuntu kernel, it boots a macOS 27 disk created by Apple&amp;#x27;s installer to a working desktop with Finder, Safari and Chrome, and a bridge routes Metal through Vulkan to the host GPU (&lt;a href=&quot;https://news.ycombinator.com/item?id=50607261&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters point to NextBSD, a related revived effort that builds FreeBSD around Mach, launchd and XPC, though apparently without XNU itself.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;The Ladybird browser enters alpha.&lt;/strong&gt; Ladybird, a browser built on its own engine rather than a fork, is &lt;a href=&quot;https://ladybird.org/posts/alpha/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;now available in alpha&lt;/a&gt; for macOS and Linux as a rolling channel with automatic updates. The team cautions that some sites will break and makes no security promises yet, and it invites security researchers to test it. Web developers can use its WebDriver and Firefox DevTools protocol support (&lt;a href=&quot;https://news.ycombinator.com/item?id=50614249&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters note that the project&amp;#x27;s switch from self-written libraries to established ones such as SQLite and Skia helped it improve substantially.&lt;/li&gt;&lt;li&gt;A user-agent string shared in the thread shows Ladybird includes Chrome and Safari compatibility tokens alongside its own name.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A step-by-step guide to running a local LLM at home.&lt;/strong&gt; This &lt;a href=&quot;https://www.gpupartner.com/blog/beginners-guide-local-ai-inkling-qwen-unsloth&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;beginner&amp;#x27;s guide&lt;/a&gt; uses Unsloth Desktop on Windows to serve a 4-bit quantized Qwen3.8-27B on an RTX 5090, with LAN access so other household devices can use it. It explains quantization tradeoffs and includes a table matching model sizes and context lengths to GPU VRAM tiers, noting that mixture-of-experts models can keep part of their weights in system RAM (&lt;a href=&quot;https://news.ycombinator.com/item?id=50603845&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Some raise the security concern that many home users exposing model servers on their LAN could create a new class of poorly secured endpoints.&lt;/li&gt;&lt;li&gt;One user running a 9B model on a laptop NPU reports about 12 tokens per second, with output quality far below frontier models and not reliable enough to trust.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A Gentoo developer describes the strain of rising vulnerability reports.&lt;/strong&gt; In a &lt;a href=&quot;https://blogs.gentoo.org/mgorny/2026/10/27/the-next-circle-of-security-hell/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;blog post&lt;/a&gt;, Michał Górny writes that projects face unprecedented volumes of reports, many automated, and that bug bounties have largely ended because of low-quality submissions. He describes how CVE scores and security scanners push maintainers into unnecessary updates and version bumps, and how projects without security branches often ship fixes bundled with API changes. That, he argues, leads downstream to more bundling and more workload (&lt;a href=&quot;https://news.ycombinator.com/item?id=50610334&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;One commenter questions whether doing meaningless version bumps to satisfy scanners reinforces the dynamic the author criticizes.&lt;/li&gt;&lt;li&gt;Another responds that a version bump is effectively the only signal users and tools read as &amp;quot;checked and not affected,&amp;quot; so there is no better channel today.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Nospeaker makes a MacBook trackpad produce speech through its haptic motor.&lt;/strong&gt; The &lt;a href=&quot;https://github.com/os6/nospeaker&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;open-source tool&lt;/a&gt; drives the Force Touch trackpad&amp;#x27;s haptic motor up to 4,000 times per second, fast enough for the glass to emit audible sound. It approximates speech by converting the system voice into two formant tones every 10 ms and playing them through functions in Apple&amp;#x27;s private MultitouchSupport framework. It has so far been tested only on an M5 Max MacBook Pro (&lt;a href=&quot;https://news.ycombinator.com/item?id=50610318&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters compare it to coaxing music out of early PCs&amp;#x27; tiny piezo beepers, and some ask whether sustained use could wear out a motor designed for short taps.&lt;/li&gt;&lt;/ul&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
