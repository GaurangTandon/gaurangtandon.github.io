    <h1>HN Mindful Digest — September 1, 2026</h1>
    <p class="date">Tuesday, September 1, 2026</p>
  </header>
  <iframe class="digest" sandbox="allow-same-origin allow-popups allow-top-navigation-by-user-activation" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;base target=&quot;_blank&quot;&gt;&lt;style&gt;:root{color-scheme:light dark}body{margin:0;font:17px/1.7 -apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;background:transparent}p{margin:0 0 .6rem}ul{margin:0 0 1.5rem;padding-left:1.1rem;list-style:none}li{position:relative;margin:.25rem 0;padding-left:1rem;font-size:.92rem;color:#555}li::before{content:&#x27;\2014&#x27;;position:absolute;left:0;color:#aaa}a{color:#1a5fb4}@media(prefers-color-scheme:dark){body{color:#e6e6e6}li{color:#a8a8a8}li::before{color:#555}a{color:#6ea8fe}}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;p&gt;&lt;em&gt;A new Claude release and a spatial world model lead a day otherwise filled with app-store policy friction, local-inference tinkering, and a twenty-year-old psychology study under fresh scrutiny.&lt;/em&gt;&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;Anthropic releases Claude Fable 5.1 and Mythos 5.1, the same model with different safeguard levels.&lt;/strong&gt; Fable 5.1 is generally available while Mythos 5.1 is restricted to trusted-access programs for cybersecurity and life-sciences work, and Anthropic says typical workloads will cost about 25% less than Fable 5 because cache reads are now cheaper, with agentic workloads saving up to roughly 45%. The &lt;a href=&quot;https://www.anthropic.com/claude-fable-and-mythos-5-1&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;announcement&lt;/a&gt; also describes an Enterprise Frontier Safeguards system for customer-controlled data storage arriving in phases this fall, and cyber safeguards that produce 60% fewer false positives and now permit vulnerability discovery but not exploit development (&lt;a href=&quot;https://news.ycombinator.com/item?id=49525378&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Several commenters treat the pricing change as the real headline, noting that cache reads at a quarter of the old cost mainly benefit long-running agents that repeatedly reread prior transcripts.&lt;/li&gt;&lt;li&gt;Some report that the previous Fable&amp;#x27;s safeguards intervened often enough that they had fallen back to Opus, and question whether the gains justify the price for routine coding.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;World Labs introduces Atlas, a world model trained natively on text, images, video, and 3D.&lt;/strong&gt; Atlas is a multimodal autoregressive diffusion transformer that places inputs in a shared spatial context, and World Labs says it can generate camera-controlled video up to one minute long at 1440p, reconstruct real scenes from as few as two or three images, and produce RGB and depth data for simulated robots. The &lt;a href=&quot;https://www.worldlabs.ai/blog/atlas&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;announcement&lt;/a&gt; says Atlas will power future versions of Marble and is open for early-access requests (&lt;a href=&quot;https://news.ycombinator.com/item?id=49525160&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters observe that in the demos time appears frozen while the camera moves, and ask whether imagined objects persist when the view turns back around.&lt;/li&gt;&lt;li&gt;Others note the term &amp;quot;world model&amp;quot; is now used loosely across the field, while some see the joint scene-plus-sensor output as meaningful for robotics data generation.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A small transformer trained from scratch for 1.5 hours reaches 44% on the ARC-AGI-1 public eval.&lt;/strong&gt; Mithil Vakde&amp;#x27;s approach trains at test time on both train and eval puzzles using per-task embeddings, 3D rotary position embeddings, and color and dihedral augmentations, with the run costing about 67 cents on a single 5090 GPU. The &lt;a href=&quot;https://mvakde.github.io/blog/44-on-arc-1/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;write-up&lt;/a&gt; reports ablations showing that removing either the 3D positional embeddings or the per-task embeddings drops the score to about 25%, and the code is open source (&lt;a href=&quot;https://news.ycombinator.com/item?id=49519939&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters question how much a model built for one benchmark tells us about generalization, since it is trained specifically on ARC-style tasks.&lt;/li&gt;&lt;li&gt;Several agree with the author&amp;#x27;s claim that recent LLM gains on ARC are driven mainly by post-training on synthetic data rather than general reasoning.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Google Play has rejected AnkiDroid updates over its donation link and threatens removal on 11 September.&lt;/strong&gt; The flashcard app&amp;#x27;s donations go to Open Source Collective, which holds an IRS 501(c)(6) tax-exempt determination, but Google&amp;#x27;s payment policy only allows outside donation links for validated tax-exempt organizations and its support team says the recipient is not tax-exempt. The maintainers&amp;#x27; &lt;a href=&quot;https://github.com/ankidroid/Anki-Android/issues/21656&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;issue&lt;/a&gt; says they are removing the link from the Play Store build under protest, since the app would otherwise be delisted everywhere except India and Russia (&lt;a href=&quot;https://news.ycombinator.com/item?id=49520022&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Several commenters argue the distinction likely hinges on whether donations are tax-deductible for the donor, which 501(c)(3) donations are and 501(c)(6) donations are not.&lt;/li&gt;&lt;li&gt;Others point to Google&amp;#x27;s 2019 removal of WireGuard as prior art and note Google&amp;#x27;s alternative billing scheme exists but carries a Play service fee.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;The ChatGPT desktop app ships a full LibreOffice installation alongside Python and Node.&lt;/strong&gt; Simon Willison found about 1.7GB in the app&amp;#x27;s cache folder, including a Python runtime, a Node.js runtime, and native binaries for Poppler, git, and LibreOffice, plus skill files telling the agent how to use them. His &lt;a href=&quot;https://simonwillison.net/2026/Sep/1/codex-libreoffice/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;note&lt;/a&gt; is brief and was not written with a wider audience in mind (&lt;a href=&quot;https://news.ycombinator.com/item?id=49527396&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters speculate that LibreOffice is what handles Microsoft Office documents, which might explain rendering problems some users see with their files.&lt;/li&gt;&lt;li&gt;Others ask whether the runtime is bundled from the start or downloaded on demand when a task first needs it, and some see nothing unusual in a productivity app carrying heavy dependencies.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Jujutsu creator Martin von Zweigbergk becomes CTO of East River Source Control.&lt;/strong&gt; von Zweigbergk started Jujutsu as a side project in late 2019 and will continue as a core maintainer of the Apache 2.0 licensed project. The &lt;a href=&quot;https://ersc.io/blog/martin-joins-ersc&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;press release&lt;/a&gt; quotes him saying the remote server is still Git and the storage layer needs to change, and says ERSC Storage enters private beta later this month (&lt;a href=&quot;https://news.ycombinator.com/item?id=49525297&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Some commenters question what ERSC offers over GitHub, since Jujutsu works on top of Git and they see it primarily as a better user experience layer.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Data Colada presents evidence of data tampering in a widely cited 2002 procrastination study.&lt;/strong&gt; A forthcoming Psychological Science paper failed to replicate Study 2 of Ariely and Wertenbroch&amp;#x27;s deadlines experiment, and the Data Colada authors analyzed original data files that a replicator received by email in 2006, concluding the data for both main studies were tampered with. Their &lt;a href=&quot;https://datacolada.org/138&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;post&lt;/a&gt; notes the reported effect was implausibly large for 20 participants per condition, that Wertenbroch appears never to have had access to the data, and that both original authors have asked the journal to retract the paper (&lt;a href=&quot;https://news.ycombinator.com/item?id=49516199&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters note this is one of many documented problems with Ariely&amp;#x27;s work and are surprised that new issues are still surfacing.&lt;/li&gt;&lt;li&gt;Several point out the study needed no special equipment and was cheap to rerun, yet went unreplicated for two decades, and ask how incentives could reward replication.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A Show HN tool streams a 125B-parameter mixture-of-experts model from SSD on a 48GB Mac.&lt;/strong&gt; slotstream is a single Swift binary that keeps the model&amp;#x27;s 3.8GB trunk resident, pages experts through a fixed pool of memory slots, and reports about 12 tokens per second warm decode with 32GB peak memory on a 48GB M5 Pro. The &lt;a href=&quot;https://github.com/carloslfu/slotstream&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;repository&lt;/a&gt; speaks the Ollama and OpenAI chat APIs, needs roughly 110GB of free disk, and notes that only the 48GB row of its performance table is measured on real hardware (&lt;a href=&quot;https://news.ycombinator.com/item?id=49524447&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters list several existing projects doing essentially the same expert-offloading on Apple Silicon and would prefer collaboration or upstreaming into MLX over another near-identical repo.&lt;/li&gt;&lt;li&gt;Some doubt the estimated throughput for 16GB machines, citing their own experience with thermal limits on similar hardware.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Mozilla adds an optional built-in ad blocker to Firefox on iOS.&lt;/strong&gt; The feature uses Apple&amp;#x27;s WebKit Content Blocker technology with the EasyList filter list, is off by default, and does not block ads served directly by the site, ads in search results, or Firefox&amp;#x27;s own sponsored new-tab content. Mozilla&amp;#x27;s &lt;a href=&quot;https://blog.mozilla.org/en/firefox/ad-blocker-on-ios/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;post&lt;/a&gt; explains that iOS does not support extensions the way desktop and Android do, so blocking had to be built into the browser itself (&lt;a href=&quot;https://news.ycombinator.com/item?id=49521973&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters note the feature is an experimental progressive rollout that many users still cannot see, and that Mozilla&amp;#x27;s support page says remote improvements must be enabled for it to appear.&lt;/li&gt;&lt;/ul&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
