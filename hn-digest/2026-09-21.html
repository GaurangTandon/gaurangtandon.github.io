    <h1>HN Mindful Digest — September 21, 2026</h1>
    <p class="date">Monday, September 21, 2026</p>
  </header>
  <iframe class="digest" sandbox="allow-same-origin allow-popups allow-top-navigation-by-user-activation" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;base target=&quot;_blank&quot;&gt;&lt;style&gt;:root{color-scheme:light dark}body{margin:0;font:17px/1.7 -apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;background:transparent}p{margin:0 0 .6rem}ul{margin:0 0 1.5rem;padding-left:1.1rem;list-style:none}li{position:relative;margin:.25rem 0;padding-left:1rem;font-size:.92rem;color:#555}li::before{content:&#x27;\2014&#x27;;position:absolute;left:0;color:#aaa}a{color:#1a5fb4}@media(prefers-color-scheme:dark){body{color:#e6e6e6}li{color:#a8a8a8}li::before{color:#555}a{color:#6ea8fe}}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;p&gt;&lt;em&gt;Today&amp;#x27;s stories lean toward local and small AI models, a phone app that listens for camera glasses, and two looks back at older computing platforms.&lt;/em&gt;&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;A free app detects nearby camera glasses over Bluetooth.&lt;/strong&gt; &lt;a href=&quot;https://www.wired.me/story/meta-smart-glasses-detector-app-zuckoff&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;ZuckOff&lt;/a&gt;, built by Polish developer Pawel Szydlowski, listens for the Bluetooth manufacturer signatures that Ray-Ban Meta, Oakley Meta, Snap Spectacles and similar glasses broadcast, and alerts the user when one is in range. The &lt;a href=&quot;https://zuckoff.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;app&amp;#x27;s own page&lt;/a&gt; is explicit about its limits: it cannot tell whether glasses are recording or who is wearing them, signal strength gives only rough distance with no direction, and a few standalone models stay silent. Basic scanning is free, with background monitoring, widgets and CSV export in a paid tier (&lt;a href=&quot;https://news.ycombinator.com/item?id=49785397&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters ask how manufacturer signatures could be protected from spoofing, and several expect vendors to change their Bluetooth advertising so the detection stops working.&lt;/li&gt;&lt;li&gt;Others correct the headline framing: the app flags camera glasses from several makers, not only Meta&amp;#x27;s.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;xAI releases Grok 4.7 at the same price as Grok 4.6.&lt;/strong&gt; The &lt;a href=&quot;https://x.ai/news/grok-4-7&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;announcement&lt;/a&gt; describes a new, larger base model trained with a longer reinforcement learning run weighted toward multi-hour tasks, with claimed gains in self-verification and long-context handling. Pricing stays at the Grok 4.6 level, a faster variant costs twice as much, and the post reports results on coding, office-work, legal and clinical benchmarks alongside a new safeguard stack (&lt;a href=&quot;https://news.ycombinator.com/item?id=49788838&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters question the headline chart for omitting one competitor model, and note that a larger model at unchanged pricing implies thinner margins.&lt;/li&gt;&lt;li&gt;Several report mixed personal experience with Grok for chat versus coding, and say they have become skeptical of benchmark comparisons generally.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Kev is a family of small open decision models built on Qwen3.5.&lt;/strong&gt; The &lt;a href=&quot;https://github.com/jaredpalmer/kev/tree/main&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;project&lt;/a&gt; offers 0.8B, 4B and 9B models with training code and evaluation data, answering yes/no, multiple-choice and rating questions in a single request and returning probabilities rather than a single label. It mirrors the API of TypeSafe&amp;#x27;s System One so that SDK can point at a local server, and the 4B and 9B models run on a 32 GB Mac (&lt;a href=&quot;https://news.ycombinator.com/item?id=49783999&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters point to several similar open projects appearing at once and note that classification models are not new, so the interest is partly a return to a simpler paradigm.&lt;/li&gt;&lt;li&gt;Others observe that without tool calling, the knowledge cutoff becomes a practical problem that requires continual retraining or frequent version swaps.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;MacStories reviews the M5 Ultra Mac Studio for local AI agents.&lt;/strong&gt; Federico Viticci tested the &lt;a href=&quot;https://www.macstories.net/stories/m5-ultra-mac-studio-review-the-dream-mac-for-local-ai-agents/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;256 GB configuration&lt;/a&gt; against an M3 Ultra and a desktop PC with an RTX 5090, and now runs his personal assistants on a locally hosted Qwen model by default. He acknowledges the 5090 retains a memory-bandwidth edge but prefers the Mac for size, heat and noise, and stresses he is a tinkerer rather than an AI developer (&lt;a href=&quot;https://news.ycombinator.com/item?id=49787313&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters surface the generation-speed table from the review, where the RTX 5090 remains faster than the M5 Ultra at every prompt size tested.&lt;/li&gt;&lt;li&gt;Several note the tested configuration costs well into five figures, that a 512 GB option arrives in October, and that the review does not answer whether a developer would be as productive on local models as on a cloud subscription.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Show HN: a continual-learning byte-level model that trains on an 8 GB GPU.&lt;/strong&gt; &lt;a href=&quot;https://github.com/volotat/mini-AGI/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;Mini-AGI&lt;/a&gt; keeps its weights on disk and pages them onto the GPU as needed, grows new capacity when it runs short, prunes unused parts, and uses the same code path for reading and serving so training never stops. The author calls it a toy-level experiment meant to show continual learning without catastrophic forgetting on modest hardware, and says weights will be published after the first pass over the corpus finishes (&lt;a href=&quot;https://news.ycombinator.com/item?id=49783133&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;One commenter asks whether the architecture actually generalizes or mostly memorizes, suggesting basic tests such as number addition.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Raspberry Pi now blocks boards with swapped RAM chips.&lt;/strong&gt; A &lt;a href=&quot;https://forums.raspberrypi.com/viewtopic.php?p=2380887#p2380888&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;forum thread&lt;/a&gt; reports that a check now prevents boards whose memory chips have been replaced from working as higher-capacity units. The thread drew criticism from enthusiasts who modify their own hardware (&lt;a href=&quot;https://news.ycombinator.com/item?id=49786689&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters explain the motivation: sellers were buying low-RAM boards, swapping in larger and sometimes reject-grade chips, and reselling them as higher SKUs, with failures landing on Raspberry Pi as returns.&lt;/li&gt;&lt;li&gt;Several note the gate lives in the closed-source EEPROM firmware, and that the check is reportedly circumventable.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Bryan Cantrill on what Sun Microsystems got wrong.&lt;/strong&gt; Prompted by an Oxide t-shirt paying homage to Sun, Cantrill &lt;a href=&quot;https://bcantrill.dtrace.org/2026/09/20/what-sun-got-wrong/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;distills his view&lt;/a&gt; to one sentence: Sun had become bored with the mechanics of running a business. He recounts a 2005 startup running OpenSolaris that could not get Sun to answer the phone while a Dell account executive had servers leased and delivered within two weeks; Cantrill later joined that startup, which also hired the Dell rep, and the two went on to found Oxide together (&lt;a href=&quot;https://news.ycombinator.com/item?id=49787436&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters who bought hardware in the late 1990s confirm the contrast, describing forced sales meetings and endless quote revisions at Sun and DEC versus next-day Dell orders.&lt;/li&gt;&lt;li&gt;Others add that Solaris lacked a package manager and had clumsy patching, and that Sun&amp;#x27;s beefy-server, thin-client model was easily undercut by commodity Linux hardware.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A community project revives Commodore&amp;#x27;s Amiga Unix.&lt;/strong&gt; &lt;a href=&quot;https://amigaux.org/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;amigaux.org&lt;/a&gt; picks up Amix, the System V Release 4 port shipped in 1990 to 1992, and brings it to 68040 and 68060 machines and modern accelerator cards with a package manager, a Linux-hosted cross toolchain, new SCSI and ethernet drivers, and bootable install media. The team states that parts of the work use generative AI to read old kernel binaries, since no source exists, with humans reviewing every change and testing on real hardware, and documents confidence levels in a public log (&lt;a href=&quot;https://news.ycombinator.com/item?id=49781436&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters point out that NetBSD still fully supports Amiga and Debian once did, and question why anyone would choose SVR4 over BSD beyond historical interest.&lt;/li&gt;&lt;li&gt;Others express concern that the project&amp;#x27;s text reads as largely LLM-generated and raise possible trademark issues.&lt;/li&gt;&lt;/ul&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
