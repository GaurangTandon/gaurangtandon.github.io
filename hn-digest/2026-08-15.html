  <header>
    <h1>HN Mindful Digest — August 15, 2026</h1>
    <p class="date">Saturday, August 15, 2026</p>
  </header>
  <iframe class="digest" sandbox="allow-same-origin allow-popups allow-top-navigation-by-user-activation" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;base target=&quot;_blank&quot;&gt;&lt;style&gt;:root{color-scheme:light dark}body{margin:0;font:17px/1.7 -apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;background:transparent}p{margin:0 0 .6rem}ul{margin:0 0 1.5rem;padding-left:1.1rem;list-style:none}li{position:relative;margin:.25rem 0;padding-left:1rem;font-size:.92rem;color:#555}li::before{content:&#x27;\2014&#x27;;position:absolute;left:0;color:#aaa}a{color:#1a5fb4}@media(prefers-color-scheme:dark){body{color:#e6e6e6}li{color:#a8a8a8}li::before{color:#555}a{color:#6ea8fe}}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;p&gt;&lt;em&gt;A quieter day than the headlines suggest: browser extensions, export-control false positives, ISA design, and a physics toy you can hear.&lt;/em&gt;&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;Firefox says it will continue supporting uBlock Origin as Edge moves to Manifest V3.&lt;/strong&gt; Mozilla stated on Bluesky that its support for the extension &amp;quot;isn&amp;#x27;t going anywhere,&amp;quot; after news that Microsoft Edge will soon lock out ad blockers built on Manifest V2, following Chrome&amp;#x27;s earlier migration (&lt;a href=&quot;https://www.pcworld.com/article/3212428/firefox-is-now-the-last-major-browser-that-still-supports-ublock-origin.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;PCWorld&lt;/a&gt;, &lt;a href=&quot;https://news.ycombinator.com/item?id=49303202&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;). Because Opera, Brave, Vivaldi and Samsung Browser are all Chromium-based, and Safari and DuckDuckGo never supported the extension, Firefox is left as the only major browser running full uBlock Origin.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Commenters note Brave offers a Manifest V2 opt-out specifically for uBlock Origin, which complicates the &amp;quot;last browser standing&amp;quot; framing.&lt;/li&gt;
&lt;li&gt;Several point out Firefox additionally reviews the code of a curated set of recommended extensions on each update, a check most stores do not perform.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A cryptographer argues that AI-assisted hardening may cut off law enforcement&amp;#x27;s main surveillance route.&lt;/strong&gt; Matthew Green traces how agencies shifted from wiretaps to device exploitation after storage encryption and end-to-end messaging arrived, and suggests that AI-driven bug finding and patching could shrink the exploit supply that this era depends on (&lt;a href=&quot;https://blog.cryptographyengineering.com/2026/08/14/everything-is-about-to-go-dark/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;blog post&lt;/a&gt;, &lt;a href=&quot;https://news.ycombinator.com/item?id=49304447&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;). He frames this as a problem for the broader security and privacy community rather than a straightforward win.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Commenters press on the piece&amp;#x27;s unresolved question of who &amp;quot;we&amp;quot; is when the decisions are made by governments and companies rather than experts.&lt;/li&gt;
&lt;li&gt;Others describe two parallel worlds: sophisticated, well-funded offensive operations on one side, and routine breaches caused by basic misconfiguration on the other.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A developer was locked out of App Store Connect over a name match to a person who appears never to have existed.&lt;/strong&gt; Sean Byrne writes that Apple told him he &amp;quot;fully matches&amp;quot; an entry on the U.S. Consolidated Screening List — an Entity List record from a 2009 export-control case with only a common Irish name and a Sligo address, no date of birth or passport number (&lt;a href=&quot;https://conic.al/writing/the-other-sean-byrne-doesnt-exist/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;post&lt;/a&gt;, &lt;a href=&quot;https://news.ycombinator.com/item?id=49307592&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;). The superseding indictment describes that name as an alias used by co-conspirators, and Nasdaq and DHL both resolved the same false positive after he supplied documents; Apple has not replied.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;At least one commenter describes a similar unresolvable fuzzy match that has cost them significant money, with most institutions defaulting to a flat &amp;quot;computer says no.&amp;quot;&lt;/li&gt;
&lt;li&gt;Several question how a first-and-last-name match can be reported as a full match at all, given the absence of any distinguishing identifier in the record.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A detailed critique argues RISC-V&amp;#x27;s base ISA is a poor fit for cheap microcontrollers.&lt;/strong&gt; Dmitry Grinberg walks through interrupt handling without hardware register stacking, counting roughly 44 cycles of overhead before a C handler runs (38 with RV32E) against about 27 for a Cortex-M0, and argues that vendor-specific fast-interrupt extensions to close the gap fragment the standard (&lt;a href=&quot;https://dmitry.gr/?r=06.%20Thoughts&amp;amp;proj=12.%20RV&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;article&lt;/a&gt;, &lt;a href=&quot;https://news.ycombinator.com/item?id=49305492&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;). He still expects RISC-V to take the low-cost microcontroller market, &amp;quot;despite&amp;quot; the design rather than because of it.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Commenters draw the parallel to MIPS and note that any ISA can be pushed into roles it was not designed for, at a cost.&lt;/li&gt;
&lt;li&gt;One notes that RVA23-profile hardware is now shipping, pushing back on the idea that the higher-end story is still hypothetical.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;The FT reports Jane Street took a roughly $15bn loss during July&amp;#x27;s market turbulence.&lt;/strong&gt; The piece is paywalled, but per the report the firm was wrongfooted by last month&amp;#x27;s market ructions, among them the collapse of the AI-focused hedge fund Situational Awareness (&lt;a href=&quot;https://www.ft.com/content/47dd5308-dd17-404a-a615-61046defd697&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;FT&lt;/a&gt;, &lt;a href=&quot;https://news.ycombinator.com/item?id=49305927&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Commenters flag that the submitted headline differs from the FT&amp;#x27;s original, which attributes the loss to July market conditions generally rather than to Situational Awareness specifically.&lt;/li&gt;
&lt;li&gt;Others add context that the firm remains well ahead for the year overall.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A maintainer asks contributors to stop submitting thousand-line agent-generated pull requests.&lt;/strong&gt; Pete Mertz argues small PRs were always for the reviewer&amp;#x27;s benefit, not the author&amp;#x27;s, and that &amp;quot;it won&amp;#x27;t work without the whole change&amp;quot; misses the point: the goal is digestible, reviewable units, not shippable ones (&lt;a href=&quot;https://getsmall.xyz/post/cmstjfl9l000if70ljmpzr4va&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;post&lt;/a&gt;, &lt;a href=&quot;https://news.ycombinator.com/item?id=49305558&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;). He also objects to lengthy explanatory comments on well-named variables.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Several commenters report that models perform noticeably worse when asked to split work into small sequenced PRs, since dependency ordering and rebasing burn context.&lt;/li&gt;
&lt;li&gt;Others suggest mechanical enforcement — CI checks or git hooks that reject oversized diffs — while noting the deeper issue is authors who see review as a gate rather than as feedback.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Eigendrum lets you draw a shape and hear it as a drumhead.&lt;/strong&gt; The tool meshes an arbitrary outline, builds finite element stiffness and mass matrices, and solves the eigenvalue problem for the vibrating membrane, so strike position determines which modes are excited and nodal lines stay silent (&lt;a href=&quot;https://eigendrum.com/#p=circle&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;eigendrum.com&lt;/a&gt;, &lt;a href=&quot;https://news.ycombinator.com/item?id=49305250&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;). It includes the Gordon–Webb–Wolpert isospectral pair that answered Kac&amp;#x27;s &amp;quot;can one hear the shape of a drum?&amp;quot; in the negative, and shapes can also be entered as polar or parametric equations.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Commenters note that number and letter keys play individual modes in isolation, which sound distinctly microtonal compared to the full strike.&lt;/li&gt;
&lt;li&gt;At least one reports it failing on mobile Safari and serving intrusive ads instead; the developer is answering questions in the thread.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Ploopy announced the A+, an open-source trackball kit.&lt;/strong&gt; It succeeds the 2023 Adept with eight buttons (two of them knobs doing high-resolution scrolling), a detachable wrist rest, and QMK features new to trackballs: gestures via ball flicks, layers, and on-device configuration for DPI, scroll mode and handedness (&lt;a href=&quot;https://blog.ploopy.co/the-aplus-is-finally-here-499&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;announcement&lt;/a&gt;, &lt;a href=&quot;https://news.ycombinator.com/item?id=49306443&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;). It keeps the PMW-3360 sensor and Omron switches, and preorders open August 19 at $99 CAD.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Some commenters value the repairable, openly licensed design; others question paying comparable money for a kit that requires soldering and carries no warranty against assembled alternatives.&lt;/li&gt;
&lt;li&gt;One notes the firmware remains QMK rather than ZMK, so wireless operation is not on the table.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A 2018 paper proposes teaching first-year calculus using differentials instead of derivatives.&lt;/strong&gt; Jonathan Bartlett argues that students memorize many separate procedures for what is essentially one task, and that a differential-first treatment collapses several rules into a single process leaning on existing algebra skills (&lt;a href=&quot;https://arxiv.org/abs/1811.03459&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;arXiv&lt;/a&gt;, &lt;a href=&quot;https://news.ycombinator.com/item?id=49306196&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Commenters question the paper&amp;#x27;s treatment of &amp;quot;dividing by dx,&amp;quot; saying it quietly turns dy/dx from notation into an actual quotient without defining what dy and dx are.&lt;/li&gt;
&lt;li&gt;Others are skeptical that leaning harder on algebra helps in practice, and one suggests the more useful change would be dropping sequences in favour of starting from limits and continuity.&lt;/li&gt;
&lt;/ul&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
