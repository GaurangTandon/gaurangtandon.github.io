  <header>
    <h1>HN Mindful Digest — September 26, 2026</h1>
    <p class="date">Saturday, September 26, 2026</p>
  </header>
  <iframe class="digest" sandbox="allow-same-origin allow-popups allow-top-navigation-by-user-activation" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;base target=&quot;_blank&quot;&gt;&lt;style&gt;:root{color-scheme:light dark}body{margin:0;font:17px/1.7 -apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;background:transparent}p{margin:0 0 .6rem}ul{margin:0 0 1.5rem;padding-left:1.1rem;list-style:none}li{position:relative;margin:.25rem 0;padding-left:1rem;font-size:.92rem;color:#555}li::before{content:&#x27;\2014&#x27;;position:absolute;left:0;color:#aaa}a{color:#1a5fb4}@media(prefers-color-scheme:dark){body{color:#e6e6e6}li{color:#a8a8a8}li::before{color:#555}a{color:#6ea8fe}}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;p&gt;&lt;em&gt;Today&amp;#x27;s briefing covers an open-source developer leaving Google Play, a privacy verdict against Facebook, a call to train more mathematicians alongside AI, and several practical tools for developers.&lt;/em&gt;&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;The Conversations XMPP client is now free and distributed mainly through F-Droid.&lt;/strong&gt; The developer of &lt;a href=&quot;https://gultsch.de/posts/breaking-up-with-google-play/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;Conversations&lt;/a&gt;, a federated Android messaging app that has been sold on Google Play since 2014, writes that Play Store revenue once covered their rent. Grants from NLnet and the European Commission now fund the work through the end of 2029, so they are no longer dependent on the store. They cite repeated rejected updates, two removals from the store, review waits of 14 days that also delay security fixes, and no way to reach a human reviewer, and they note that the F-Droid build is now reproducible and signed with their own key (&lt;a href=&quot;https://news.ycombinator.com/item?id=49855315&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Some commenters argue that Google&amp;#x27;s review process, flawed as it is, still keeps a great deal of low-quality and malicious software off the store, and that the app earned several times what Google&amp;#x27;s 15% cut took.&lt;/li&gt;&lt;li&gt;Others point out that the post&amp;#x27;s own figures show the store was a steady source of income for many years.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A New Mexico jury found Facebook liable for misleading users about privacy in the Cambridge Analytica case.&lt;/strong&gt; After a two-week trial in Santa Fe, &lt;a href=&quot;https://www.cbsnews.com/news/facebook-liable-deceiving-users-cambridge-analytica/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;jurors found&lt;/a&gt; that Facebook deceived users about a breach in which a third-party quiz harvested data from roughly 87 million profiles, and that it misled the public about its later investigations into data brokers. They found more than 2 million violations. A judge will set the penalty, the state is asking for the maximum of $5,000 per violation, and Meta says it disagrees with the verdict. New Mexico was the only state to pursue the case, because an August multistate settlement released Meta from future liability over Cambridge Analytica (&lt;a href=&quot;https://news.ycombinator.com/item?id=49852302&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters note that, according to earlier accounts of the scandal, the harvested data was mostly public profile information such as page likes, birthdays and current city, not private messages.&lt;/li&gt;&lt;li&gt;Several remark that the verdict comes roughly a decade after the events.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A guest essay argues that AI-generated mathematics will require more human mathematicians, not fewer.&lt;/strong&gt; In a post on &lt;a href=&quot;https://terrytao.wordpress.com/2026/09/24/were-gonna-need-a-lot-more-mathematicians/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;Terence Tao&amp;#x27;s blog&lt;/a&gt;, Amit Sahai writes that current AI systems are already producing novel mathematical ideas. He proposes funded research groups whose job is to understand those results with AI assistance. His example is a hypothetical AI-designed fusion plant, which he says would need people who understand the models behind any safety guarantee before a society relies on it (&lt;a href=&quot;https://news.ycombinator.com/item?id=49852717&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;A former print contractor describes how Apple&amp;#x27;s 2011 Cards app was produced.&lt;/strong&gt; Lex Friedman&amp;#x27;s &lt;a href=&quot;https://lexontech.org/fifteen-years-later-the-apple-cards-origin-story&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;account&lt;/a&gt;, based on an anonymous source who ran the print program, says Steve Jobs initiated the letterpress greeting-card app during his final year. The cards were printed on cotton stock by a shop running restored Heidelberg presses. Because Apple did not want visible barcodes, envelopes carried a UV-only barcode that the USPS agreed to scan at each stage of delivery (&lt;a href=&quot;https://news.ycombinator.com/item?id=49854693&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;A co-founder of Sincerely says their company already offered iPhone-to-printed-card apps such as Postagram when Apple announced Cards.&lt;/li&gt;&lt;li&gt;Commenters who used Apple&amp;#x27;s print services outside the US describe them as high quality but slow, expensive and awkward to receive internationally.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A woman was held for 13 days after police linked her car to a fatal crash using a license-plate camera sighting.&lt;/strong&gt; According to &lt;a href=&quot;https://www.jezebel.com/flock-cameras-data-innocent-woman-arrested-lindsey-isaacs-palm-beach-florida-lawsuit-vehicular-homicide&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;the report&lt;/a&gt;, a Flock automated license plate reader recorded Lindsey Isaacs&amp;#x27; black Dodge Durango several miles from a crash that killed three people. Witnesses had described a maroon Durango, and her car showed no damage. She was nonetheless charged with vehicular homicide months later and held in jail, including time in solitary confinement, and she has since testified before Congress (&lt;a href=&quot;https://news.ycombinator.com/item?id=49852065&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Several commenters say the headline misplaces responsibility: the camera recorded a location, and the arrest resulted from officers acting despite contradicting evidence.&lt;/li&gt;&lt;li&gt;Others note that the same Senate hearing included testimony from privacy advocates, including a representative of the EFF.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A developer describes their heavy use of AI coding agents and a month of working without them.&lt;/strong&gt; The &lt;a href=&quot;https://blog.bustikiller.com/2026/09/25/one-month-without-ai.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;post&lt;/a&gt; traces a progression from autocomplete to several agents running in parallel worktrees. The author says they gradually lost track of what their code did and stopped reading AI-written PR descriptions. They report that tasks taking an agent five minutes could take two days to review amid constant context switching (&lt;a href=&quot;https://news.ycombinator.com/item?id=49855018&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters encourage writing PR descriptions by hand, reasoning that an author who cannot summarize a change probably does not understand it well enough for others to review it.&lt;/li&gt;&lt;li&gt;A dissenting view holds that agentic tools are hard to give up for productivity reasons, and suggests occasional manual coding to keep skills sharp, much as pilots periodically fly by hand.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A short Python script classifies text and images by reading an LLM&amp;#x27;s token probabilities.&lt;/strong&gt; Inspired by Jev, &lt;a href=&quot;http://allanrbo.blogspot.com/2026/09/a-jev-like-wrapper-for-llms-including.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;the post&lt;/a&gt; presents each question as lettered options and requests a single output token with logprobs, which yields a probability for each answer. The author extends the approach to webcam frames and reports about 1 frame per second, with three questions per frame, using Gemma 4 12B on an RTX 3090 (&lt;a href=&quot;https://news.ycombinator.com/item?id=49853175&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Some commenters expect general chat models tuned with RLHF to give less calibrated probabilities than a system like Jev that is specifically trained to produce them.&lt;/li&gt;&lt;li&gt;Others ask whether grammar-constrained decoding already achieves much the same result, and point out that this approach is considerably slower and costlier.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Floci offers MIT-licensed local emulators for AWS, Azure, GCP and Oracle Cloud.&lt;/strong&gt; The &lt;a href=&quot;https://floci.io&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;project&lt;/a&gt; ships native binaries that run without credentials or auth tokens, and it presents the AWS emulator as a drop-in LocalStack replacement covering 119 services. It says Lambda, RDS and ElastiCache run on real containers and database engines rather than mocks, and it pitches the tool for CI, local development and sandboxed AI agents (&lt;a href=&quot;https://news.ycombinator.com/item?id=49854416&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;One commenter reports using it with Testcontainers for integration tests and finding it much lighter than LocalStack.&lt;/li&gt;&lt;li&gt;Several ask whether it could serve beyond testing, for example as a path to migrate gradually away from a cloud provider.&lt;/li&gt;&lt;/ul&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
