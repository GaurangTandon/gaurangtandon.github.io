    <h1>HN Mindful Digest — August 20, 2026</h1>
    <p class="date">Thursday, August 20, 2026</p>
  </header>
  <iframe class="digest" sandbox="allow-same-origin allow-popups allow-top-navigation-by-user-activation" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;base target=&quot;_blank&quot;&gt;&lt;style&gt;:root{color-scheme:light dark}body{margin:0;font:17px/1.7 -apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;background:transparent}p{margin:0 0 .6rem}ul{margin:0 0 1.5rem;padding-left:1.1rem;list-style:none}li{position:relative;margin:.25rem 0;padding-left:1rem;font-size:.92rem;color:#555}li::before{content:&#x27;\2014&#x27;;position:absolute;left:0;color:#aaa}a{color:#1a5fb4}@media(prefers-color-scheme:dark){body{color:#e6e6e6}li{color:#a8a8a8}li::before{color:#555}a{color:#6ea8fe}}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;p&gt;&lt;em&gt;A quiet day of small technical findings and old arguments revisited, with privacy and measurement running through most of it.&lt;/em&gt;&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;An AliExpress page runs a silent WebAudio graph that can hold a Bluetooth audio link open.&lt;/strong&gt; After noticing that loading the AliExpress homepage stopped audio from playing on his phone, one investigator instrumented the page and found two AudioContext objects created by obfuscated scripts (&lt;a href=&quot;https://blog.laserphile.com/2026/08/aliexpress-webpage-keeping-multipoint.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;write-up&lt;/a&gt;), built as a sawtooth oscillator feeding an analyser and a gain node set to zero, still connected to the audio destination. The same bundles measure canvas, WebGL, hardware concurrency, plugins and interaction events, which the author reads as fingerprinting for tracking or fraud scoring, though he notes he cannot see what the server does with it (&lt;a href=&quot;https://news.ycombinator.com/item?id=49372583&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Several commenters report matching symptoms independently, including the AliExpress iOS app in the background confusing a car stereo into thinking a voice command was being given.&lt;/li&gt;
&lt;li&gt;One suggestion in the thread is that audio playback should be permission-gated like camera and microphone access, since tab mute does not stop a graph with no media element.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A Kansas police department is dropping its Flock automated license plate cameras.&lt;/strong&gt; Gardner police are discontinuing the system amid broader scrutiny of plate readers (&lt;a href=&quot;https://www.kmbc.com/article/gardner-kansas-flock-cameras-license-plate-readers-privacy/73468724&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;report&lt;/a&gt;), part of a wider reassessment of how the data these systems collect is shared and audited (&lt;a href=&quot;https://news.ycombinator.com/item?id=49368625&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Commenters focus on a figure cited in the piece that more than 1,200 vendors had access to the data, with the official quoted saying he did not know all of their identities.&lt;/li&gt;
&lt;li&gt;Others point to published reporting on dozens of officers charged or accused of querying plate reader systems for personal reasons, and argue the term &amp;quot;license plate reader&amp;quot; understates what the cameras capture.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A 2022 argument that trigonometric functions should take turns rather than radians resurfaced.&lt;/strong&gt; Casey Muratori&amp;#x27;s post observes that calling code typically multiplies a value already in [0,1] by tau, while fast sin implementations immediately multiply by 4/pi to undo it, so the conversion is wasted work (&lt;a href=&quot;https://www.computerenhance.com/p/turns-are-better-than-radians&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;article&lt;/a&gt;). He adds that quarter and half turns are exactly representable in binary floating point where the equivalent radian values never are, and notes half-turn variants already exist, such as CUDA&amp;#x27;s sincospi (&lt;a href=&quot;https://news.ycombinator.com/item?id=49369408&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Commenters raise calculus as the practical catch: differentiating sin(2πx) reintroduces the factor of 2π, so the constant reappears wherever rates of change matter.&lt;/li&gt;
&lt;li&gt;Others note that trig functions are used well beyond geometry — phase angles of periodic signals, for instance — and that radians have the property of relating angle directly to arc length, so redefining the standard functions would be disruptive even if new turn-based ones are useful.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Raymond Chen&amp;#x27;s 2003 account of people reading meaning into Windows artwork drew renewed attention.&lt;/strong&gt; The post describes a government complaint that the Windows 95 anti-piracy hologram depicted a naked child — the baby was shirtless and shown only from the waist up — prompting a rushed replacement that dropped the original arm animation (&lt;a href=&quot;https://devblogs.microsoft.com/oldnewthing/20030825-00/?p=42803&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;post&lt;/a&gt;). Chen lists similar Windows XP changes, including the Red Moon Desert wallpaper and images in the User Accounts and Switch Users interfaces (&lt;a href=&quot;https://news.ycombinator.com/item?id=49371006&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Commenters surfaced a link showing a photograph of the redesigned clothed hologram, and asked without resolution which government had complained.&lt;/li&gt;
&lt;li&gt;Several offered parallel cases of images read very differently across cultures, including reactions to a bathing scene in My Neighbour Totoro and a collection of company logos read as body parts.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A single-page site argues against forwarding unedited chatbot output as your own reply.&lt;/strong&gt; dontpastetheai.com makes the case that the person asking already has the same tools, so the value is in your own reading and judgement; it suggests extracting the part that answers the question, quoting a model explicitly when a passage is genuinely useful, and treating &amp;quot;no strong opinion&amp;quot; as a legitimate answer (&lt;a href=&quot;https://dontpastetheai.com/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;site&lt;/a&gt;). It presents itself as satire in the lineage of nohello.net and dontasktoask.com (&lt;a href=&quot;https://news.ycombinator.com/item?id=49371857&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Multiple commenters said the page itself, and especially its &amp;quot;angry&amp;quot; variant, reads to them as model-generated, pointing to specific stock phrasing.&lt;/li&gt;
&lt;li&gt;One raised the case the page does not address: non-native English speakers who lean on a model to avoid sounding awkward in writing.&lt;/li&gt;
&lt;/ul&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
