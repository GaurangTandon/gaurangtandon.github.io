  <header>
    <h1>HN Mindful Digest — September 7, 2026</h1>
    <p class="date">Monday, September 7, 2026</p>
  </header>
  <iframe class="digest" sandbox="allow-same-origin allow-popups allow-top-navigation-by-user-activation" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;base target=&quot;_blank&quot;&gt;&lt;style&gt;:root{color-scheme:light dark}body{margin:0;font:17px/1.7 -apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;background:transparent}p{margin:0 0 .6rem}ul{margin:0 0 1.5rem;padding-left:1.1rem;list-style:none}li{position:relative;margin:.25rem 0;padding-left:1rem;font-size:.92rem;color:#555}li::before{content:&#x27;\2014&#x27;;position:absolute;left:0;color:#aaa}a{color:#1a5fb4}@media(prefers-color-scheme:dark){body{color:#e6e6e6}li{color:#a8a8a8}li::before{color:#555}a{color:#6ea8fe}}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;p&gt;&lt;em&gt;Today&amp;#x27;s stories cluster around devices that report home, governments and hobbyists working around big vendors, and mathematics testing how much of the work AI can now do.&lt;/em&gt;&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;Gamers Nexus tests find LG smart TVs scanning home networks and logging microphone audio in standby.&lt;/strong&gt; Working with Level1Techs and security researchers, the team captured traffic from retail LG OLED sets including the G5 and found them mapping phones and smartwatches on the local network and recording names and signal strengths of nearby Wi-Fi networks, with the data feeding LG Ad Solutions. In bench tests the TVs captured clean microphone audio while apparently powered down, stored it locally when Ethernet was disconnected, and uploaded it once reconnected; the researchers also reported webOS remote code execution bugs now in responsible disclosure and recommended keeping the sets offline. &lt;a href=&quot;https://www.notebookcheck.net/LG-smart-TVs-caught-logging-audio-with-screen-off-and-snooping-on-local-devices.1391214.0.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;Notebookcheck&amp;#x27;s summary&lt;/a&gt; notes LG had not commented (&lt;a href=&quot;https://news.ycombinator.com/item?id=49594878&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Owners describe placing TVs on an isolated network with DNS redirected and internet blocked, and routing all streaming through an external box instead.&lt;/li&gt;&lt;li&gt;One commenter observed a different brand&amp;#x27;s TV flooding the network for hours after being turned off, though without visible outbound traffic, suggesting sloppy network stacks and deliberate collection can look similar from outside.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Switzerland begins a 3,000-workstation pilot to replace Microsoft 365 with open-source tools.&lt;/strong&gt; The Federal Chancellery is spending CHF 9 million on the pilot, about 7 percent of the federal administration&amp;#x27;s 54,000 computers, after a proof of concept with 172 employees testing the German openDesk suite rated document work and email positively but found limits in large video conferences. The new system runs alongside Microsoft 365 rather than replacing it outright, with a target of end of 2027, while the military&amp;#x27;s Cyber Command plans to move fully to openDesk by October 2026. &lt;a href=&quot;https://itsfoss.com/news/switzerland-replace-microssoft-pilot/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;It&amp;#x27;s FOSS reports&lt;/a&gt; the effort builds on a 2024 law requiring open-source publication of government software (&lt;a href=&quot;https://news.ycombinator.com/item?id=49594251&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Several commenters expect Office to be the sticking point, both because of file format compatibility and because users are accustomed to its interface.&lt;/li&gt;&lt;li&gt;Others point out that government migrations must also handle decades of custom software, legacy hardware drivers, and guaranteed patching support, which personal Linux use never faces.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A subset of Python implemented in 1,024 bytes of C.&lt;/strong&gt; Austin Henley set out to fit a Python-looking interpreter in 512 bytes, found that too small, and settled at 1,024 bytes of C89 with no macro tricks. The interpreter keeps no intermediate representation: expressions are evaluated during recursive descent parsing, loops re-parse the source each iteration, and functions work by saving the caller position and jumping to the body, with limitations such as single-letter variable names and no error handling. &lt;a href=&quot;https://austinhenley.com/blog/python1024.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;The write-up&lt;/a&gt; covers the golfing techniques used to shrink the readable version (&lt;a href=&quot;https://news.ycombinator.com/item?id=49591876&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Some commenters object that this is a tiny invented language that merely resembles Python rather than any real subset of it.&lt;/li&gt;&lt;li&gt;Others point to prior work in the same spirit, including SectorLISP and the embeddable Snek language for small microcontrollers.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;bzip3, a bzip2 successor, resurfaces with large compression-ratio claims.&lt;/strong&gt; The project combines a Burrows-Wheeler transform built on suffix arrays, an order-0 context-mixing entropy coder, and an LZ-plus-prediction pass, and targets text and code. &lt;a href=&quot;https://github.com/iczelia/bzip3&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;The README&lt;/a&gt; benchmarks it on a tarball of every Perl 5 release, where the largest block size produced a file roughly a quarter the size of xz&amp;#x27;s output and much smaller than Zstandard&amp;#x27;s (&lt;a href=&quot;https://news.ycombinator.com/item?id=49598291&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters argue the benchmark is skewed: bzip3 used a very large block size while zstd was left at its default window, on a corpus of near-duplicate files that is the ideal case for BWT compressors, and zstd&amp;#x27;s long-range mode was not tried.&lt;/li&gt;&lt;li&gt;Several also note the comparison pits parallel bzip3 against single-threaded bzip2 rather than pbzip2, and that the last release is about a year old with a currently failing build.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Most smartphones sold in the EU still lack required repair information a year into the rules.&lt;/strong&gt; Right to Repair Europe reviewed the European Product Registry for Energy Labelling and found only about 18 percent of the 2,334 smartphone records from the past year link to spare-parts prices or repair instructions, with roughly half leaving the field blank and others pointing to generic support pages or even Temu and AliExpress. Some of the non-compliant makers nonetheless gave themselves the top self-declared repairability grade. &lt;a href=&quot;https://www.theregister.com/personal-tech/2026/09/07/smartphone-makers-dont-bother-to-comply-with-eu-repairability-requirements/5294532&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;The Register notes&lt;/a&gt; that a separate user-replaceable battery requirement takes effect next February (&lt;a href=&quot;https://news.ycombinator.com/item?id=49597189&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters with GDPR experience say EU enforcement is typically slow and large fines arrive only after repeated warnings, so low early compliance is expected rather than surprising.&lt;/li&gt;&lt;li&gt;Some add that a distant, appealable fine is often cheaper than compliance, while others note 18 percent is still a real increase over the near-zero repair documentation of a few years ago.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A $70 credit-card-sized e-ink reader is gaining a following and open firmware.&lt;/strong&gt; The Xteink X3 attaches magnetically to the back of a phone and offers a basic monochrome display with no touchscreen, backlight, or one-click ebook store integration, and its stock software struggles with covers and formatting. &lt;a href=&quot;https://www.theatlantic.com/technology/2026/09/xteink-e-reader-best-technology-years/688539/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;The Atlantic&amp;#x27;s Saahil Desai&lt;/a&gt; credits the tiny page size with getting him reading in short idle moments, and describes a community firmware called Crosspoint that adds fonts, reading stats, and recently Libby library access (&lt;a href=&quot;https://news.ycombinator.com/item?id=49596629&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;One commenter says a competitor published allegations earlier this year about the founder&amp;#x27;s prior ventures and some product specifications, which the commenter claims were later substantiated.&lt;/li&gt;&lt;li&gt;Kindle users note the borrow-and-sync experience through Libby is unlikely to be as seamless on third-party firmware, and reading progress will not sync.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;TiVo will move automatic commercial skipping to a paid add-on in November.&lt;/strong&gt; From November 2 the one-button and automatic SkipMode will leave the standard service, replaced by a 30-day trial of a Premium Auto Commercial Skip subscription whose price has not been announced. Manual 30-second skip and fast-forward remain, and existing recordings keep their skip markers until the cutoff. &lt;a href=&quot;https://cordcuttersnews.com/tivo-plans-to-end-free-automatic-commercial-skipping-in-november-tests-paid-premium-replacement-service/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;Cord Cutters News&lt;/a&gt; ties the change to parent Xperi&amp;#x27;s shift away from DVR hardware toward smart-TV software and advertising (&lt;a href=&quot;https://news.ycombinator.com/item?id=49593971&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters point out that TiVo&amp;#x27;s skip markers depend on data supplied by the company after airing rather than on-device detection, which is why the feature can be gated.&lt;/li&gt;&lt;li&gt;Several note the shrinking user base, with CableCARDs disappearing and other over-the-air recording options available.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Caltech to host a 40-hour hackathon aimed at open math problems using AI models.&lt;/strong&gt; The Mathathon, scheduled October 30 to November 1, will give a hundred teams access to frontier models and more than $2 million in AI credits to attack open conjectures, then have them defend results before mathematicians who assess their understanding. Prizes come in two rounds, the second after the community has had time to verify claims. &lt;a href=&quot;https://mathathonchallenge.com/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;The organizers&lt;/a&gt; cite several AI-assisted results from recent months as motivation (&lt;a href=&quot;https://news.ycombinator.com/item?id=49596055&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Commenters question whether a short intense format fits AI-driven math, where progress has typically come from letting a model run for days with occasional correction.&lt;/li&gt;&lt;li&gt;Others dispute the &amp;quot;first ever&amp;quot; claim, citing William Stein&amp;#x27;s Sage and BSD-conjecture hackathons nearly two decades ago, and some ask whether labs are seeking mathematicians as inexpensive validators of model output.&lt;/li&gt;&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A mathematician asks whether research math becomes a cultural institution like classical music.&lt;/strong&gt; Mike McCoy describes a new preprint from Hunan University&amp;#x27;s Wang and Wu that claims to prove the Spherical Hadwiger Conjecture, open since about 1974, with OpenAI Codex credited for proof details, gap-finding, and drafting. He has not fully verified the proof but says it passes an initial check, and argues that funding and tenure structures are poorly suited to a world where correctness is harder to judge than production. &lt;a href=&quot;https://mbmccoy.dev/posts/mathematical-conservatory/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;The post&lt;/a&gt; suggests pure math is already effectively in a conservatory, namely the academy (&lt;a href=&quot;https://news.ycombinator.com/item?id=49591793&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Working musicians in the thread push back on the analogy, saying classical and popular players earn money in largely the same ways through teaching, gigs, and side work.&lt;/li&gt;&lt;li&gt;Others argue mathematicians will still be needed to decide which problems merit compute and which definitions matter, comparing the future role to astronomers interpreting an observed universe.&lt;/li&gt;&lt;/ul&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
