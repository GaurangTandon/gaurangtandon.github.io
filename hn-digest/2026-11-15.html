    <h1>HN Mindful Digest — November 15, 2026</h1>
    <p class="date">Sunday, November 15, 2026</p>
  </header>
  <iframe class="digest" sandbox="allow-same-origin allow-popups allow-top-navigation-by-user-activation" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;base target=&quot;_blank&quot;&gt;&lt;style&gt;:root{color-scheme:light dark}body{margin:0;font:17px/1.7 -apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;background:transparent}p{margin:0 0 .6rem}ul{margin:0 0 1.5rem;padding-left:1.1rem;list-style:none}li{position:relative;margin:.25rem 0;padding-left:1rem;font-size:.92rem;color:#555}li::before{content:&#x27;\2014&#x27;;position:absolute;left:0;color:#aaa}a{color:#1a5fb4}@media(prefers-color-scheme:dark){body{color:#e6e6e6}li{color:#a8a8a8}li::before{color:#555}a{color:#6ea8fe}}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;p&gt;&lt;em&gt;Today&amp;#x27;s briefing covers a spaceflight milestone, a memory-chip antitrust ruling, a display-comfort issue on Apple&amp;#x27;s newest laptops, a license-plate surveillance case, and several substantive reads for programmers and the scientifically curious.&lt;/em&gt;&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;SpaceX caught the Starship vehicle at the end of Flight 15.&lt;/strong&gt; According to the company&amp;#x27;s &lt;a href=&quot;https://www.spacex.com/launches/starship-flight-15&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;launch page&lt;/a&gt;, Starship Flight 15 ended with the ship being caught on return, and the submission linked to SpaceX&amp;#x27;s post and the launch video. The source material gives no further technical detail about the flight (&lt;a href=&quot;https://news.ycombinator.com/item?id=50500963&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;A federal judge declined to dismiss a DRAM supply-conspiracy suit against Samsung, SK Hynix, and Micron.&lt;/strong&gt; On Nov. 14, U.S. District Judge Noël Wise of the Northern District of California denied the companies&amp;#x27; joint motion to dismiss a proposed class action alleging they coordinated cuts to conventional DRAM such as DDR5 while shifting capacity to HBM for AI accelerators, &lt;a href=&quot;https://litnews.ai/articles/garciaguirre-samsung-sk-hynix-micron-dram-conspiracy-suit-survives-dismissal&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;LitNews reports&lt;/a&gt;. The judge distinguished the Ninth Circuit&amp;#x27;s 2022 DRAM II decision and pointed to long-term HBM lock-ups, refused conventional DRAM contracts, Micron&amp;#x27;s closure of its Crucial brand, and the absence of expansion despite record prices. She gave no weight to investor talk of &amp;quot;supply discipline,&amp;quot; industry-conference meetings, or the three-firm market structure. The allegations are unproven, and answers are due Dec. 7 (&lt;a href=&quot;https://news.ycombinator.com/item?id=50502988&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;One commenter questions the theory, arguing that moving from DDR4 to DDR5 is a genuine product transition and that Chinese manufacturers can still supply DDR4.&lt;/li&gt;
&lt;li&gt;A researcher describes the practical effect: a planned workstation with 256 GB of RAM now costs several thousand dollars for memory alone.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Apple&amp;#x27;s new OLED MacBook Pro uses low-frequency PWM dimming, and some users report discomfort.&lt;/strong&gt; A &lt;a href=&quot;https://macanorak.com/the-macbook-pros-oled-pwm-problem-when-a-better-display-becomes-worse-to-use/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;MacAnorak article&lt;/a&gt; collects forum and Reddit reports of headaches, eye fatigue, and dizziness with the new &amp;quot;PROLED XDR&amp;quot; display. It cites Notebookcheck measurements of 240Hz PWM at brightness settings of 99% and below, compared with 14,880Hz on the Mini-LED M4 Pro model, which Apple still sells. The author cautions that frequency is only one factor and that not every complaint is necessarily caused by PWM (&lt;a href=&quot;https://news.ycombinator.com/item?id=50506719&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Commenters point to a peer-reviewed study in Scientific Reports finding that people can perceive flicker at frequencies well above a display&amp;#x27;s refresh rate.&lt;/li&gt;
&lt;li&gt;Several note that nobody knows how common PWM sensitivity is, and they call for research to quantify it.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;EFF and the ACLU asked a federal appeals court to require warrants for license-plate-reader searches.&lt;/strong&gt; The &lt;a href=&quot;https://www.eff.org/deeplinks/2026/11/were-asking-appeals-court-require-warrant-alpr-searches&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;EFF&amp;#x27;s amicus brief&lt;/a&gt; in the Sixth Circuit case &lt;em&gt;United States v. Sturdivant&lt;/em&gt; concerns Cleveland-area robberies in which police ran open-ended searches of the Flock and ELSAG databases to identify a suspect&amp;#x27;s car. The district court had ruled that a visible license plate carries no reasonable expectation of privacy. The brief argues that networked ALPR tracking is a Fourth Amendment &amp;quot;search&amp;quot; (&lt;a href=&quot;https://news.ycombinator.com/item?id=50503265&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Commenters cite New Hampshire&amp;#x27;s existing law as a model: it bans collecting plates for later analysis and requires non-matching images to be deleted within three minutes without leaving the device.&lt;/li&gt;
&lt;li&gt;Others go further and argue that ALPR systems should only retain hits on plates tied to an active warrant.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Sebastian Raschka published a detailed walkthrough of positional embeddings in LLMs.&lt;/strong&gt; The &lt;a href=&quot;https://magazine.sebastianraschka.com/p/understanding-positional-embeddings&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;article&lt;/a&gt; explains why transformers need explicit position information. It compares GPT-2&amp;#x27;s learned absolute embeddings, which are added before the first block, with RoPE, which is applied inside attention in models like MiniMax-M3. It includes a small PyTorch implementation and a survey of the approaches used by 2026 open-weight models (&lt;a href=&quot;https://news.ycombinator.com/item?id=50506376&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;A commenter offers a theoretical lens the article does not: positional embeddings can be understood as group representations, with RoPE representing the translation group, and this framing explains how such embeddings are derived and made learnable.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;The C++ language server clice reached version 1.0.&lt;/strong&gt; According to the &lt;a href=&quot;https://ykiko.me/en/articles/2105384023094834022/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;release post&lt;/a&gt;, clice is a Clang-based C/C++ language server written in C++23. It compiles code in an isolated process pool, so a compiler crash does not bring down the whole server, as it can with clangd. It also supports C++20 named modules, with on-disk caching of PCH and PCM files across sessions. The release follows about four months of nightly alpha builds and roughly 1,000 commits (&lt;a href=&quot;https://news.ycombinator.com/item?id=50508715&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;One commenter notes that Clang-based indexers remain far slower on very large codebases than older non-Clang indexers in Eclipse and Qt Creator, and says they would accept less precision in exchange for speed.&lt;/li&gt;
&lt;li&gt;Another observes that the release&amp;#x27;s comparison demo shows clice crashing at the same point as clangd, but in an isolated worker process rather than taking down the server.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;Crows responded to visual decision tasks about twice as fast as humans and monkeys in a new study.&lt;/strong&gt; Research published in Science and &lt;a href=&quot;https://www.nytimes.com/2026/11/15/science/birdbrain-crows-birds-research-decision.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;reported by The New York Times&lt;/a&gt; tested two carrion crows on judging whether dots on a screen moved left or right. The researchers describe the result as the first measurement of the neural speed of avian decision-making (&lt;a href=&quot;https://news.ycombinator.com/item?id=50509023&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;A commenter points out that the &amp;quot;birdbrain&amp;quot; insult refers to intelligence, not speed, so a faster reaction time does not directly rebut it.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;LinkedIn and Monster removed about 1,500 misleading job ads after a CBC investigation linked them to a multi-level marketing company.&lt;/strong&gt; &lt;a href=&quot;https://www.cbc.ca/news/canada/linkedin-monster-take-down-over-1-000-fake-job-postings-after-cbc-investigation-9.7415379&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;CBC found&lt;/a&gt; that remote &amp;quot;travel planner&amp;quot; listings advertising salaries up to $75,000 US led applicants to Evolution Travel. Applicants were asked to pay hundreds of dollars upfront plus a monthly fee, and there was no actual job. LinkedIn removed close to 900 ads and barred the companies behind them from posting, while Monster removed 600 (&lt;a href=&quot;https://news.ycombinator.com/item?id=50499723&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Commenters place this within a broader pattern of scam advertising on major platforms, and some argue that one-off takedowns need to become sustained policy enforcement against ghost listings.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;&lt;strong&gt;A developer documented building a NES emulator in the Odin language.&lt;/strong&gt; &lt;a href=&quot;https://lucypero.com/lucynes.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;lucyNES&lt;/a&gt; is a solo project, built over about seven months, that runs Battletoads and hundreds of other games. It supports seven cartridge mappers, save states, a debugger, and partial sound. The author writes that reaching a basic working state was fast, but the final 10% of accuracy took most of the effort, especially CPU–PPU timing and mapper behavior. Odin&amp;#x27;s lack of automatic integer promotion caused several bugs (&lt;a href=&quot;https://news.ycombinator.com/item?id=50506588&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer nofollow&quot;&gt;HN discussion&lt;/a&gt;).&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;One commenter notes a practical limitation: Odin depends on recent LLVM versions, which makes programs written in it harder to build on older or legacy systems.&lt;/li&gt;
&lt;/ul&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
